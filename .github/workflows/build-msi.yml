name: Build Windows Exe

on:
  push:
    branches: ["main", "github"]
    tags: ["*"]
  pull_request:
    branches: ["main", "github"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows Exe Package
        run: ./gradlew.bat packageExe

      - name: Upload workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: openpos-windows-exe
          path: "**/build/compose/binaries/main/exe/*.exe"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenPOS ${{ github.ref_name }}
          files: "**/build/compose/binaries/main/exe/*.exe"
          generate_release_notes: true
